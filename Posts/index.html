<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posts - Blog Post App</title>
    <link rel="stylesheet" href="../style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  </head>
  <body style="min-height: 100vh; display: flex; flex-direction: column;">
    <div class="container" style="flex: 1; display: flex; flex-direction: column;">
      <header class="page-header">
        <h1>Blog Posts</h1>
        <div class="user-info">
          <span class="email"></span>
          <button class="logout-btn logout">Logout</button>
        </div>
      </header>

      <div class="result" style="flex: 1;"></div>

      <div style="max-width: 800px; width: 100%; margin-top: 2rem;">
        <div class="card">
          <form id="postForm">
            <div class="form-group">
              <label for="postTitle">Title</label>
              <input type="text" id="postTitle" name="title" placeholder="Enter post title..." required>
            </div>
            <div class="form-group">
              <label for="postContent">Content</label>
              <textarea id="postContent" name="content" placeholder="Write your thoughts..." required></textarea>
            </div>
            <button type="submit" id="createBtn">Publish Post</button>
          </form>
        </div>
      </div>
    </div>

    <footer style="text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.875rem; border-top: 1px solid var(--border); margin-top: auto;">
      Blog Post App &copy; 2026
    </footer>

    <script type="module" src="../firebase.mjs"></script>
    <script type="module" src="main.mjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/moment@2.29.4/moment.min.js"></script>
  </body>
</html>
